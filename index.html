<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>ICT 10 1Q Simple Average Finder</title>

</head>

<style>
html, body {

        height: 100%;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background-position: center;
        background-image: url(https://i.pinimg.com/736x/39/22/d4/3922d47ffc69f885ecfdce261b25d212.jpg);
        background-repeat: no-repeat;
        background-size: cover;
     }


    .simplifyer {
        margin: auto;
        margin-top: 50px;
        text-align: center;
        border-radius: 50px;
        font-size: 20px;
        background-color: #F9F5F0;
        padding: 30px;
        width: 650px;
        border: 10px black;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.5)
        
    }

    button {
        background-color: #003161;
        color: white;
        border-radius: 25px;
        padding: 20px;

    }

    h1 {
        color: #003161;
        
    }

    img {
        border-radius: 25px;
        height: 300px;
        width: 350px;
    }

    input {
        border-radius: 20px;
        padding: 10px;
    }
    

</style>
<body>
    
    <br><br><br>
    <div class="simplifyer">
    <h1> Quiz Average Finder</h1>

    <br><br>
    <img src="https://i.pinimg.com/1200x/98/d3/2f/98d32f3184f355160306205e2a1a1717.jpg">

    <!-- THIS AREA IS WHERE THE USER WILL PUT THEIR GRADES -->
    <br><br>
    <input type="number" id="input1" placeholder="Enter your grade"/>
    <br><br>
    <input type="number" id="input2" placeholder="Enter your grade"/>
    <br><br>
    <button type="submit" py-click="solving_av">Get your score!</button><br/>
    
    <!-- THIS AREA IS WHERE THE OUTPUT WILL BE DISPLAYED-->
    <h2 id="message_result"></h2>

    <div id="score"></div>
    <div id="status"></div>
    <div id="invalid"></div>

    </div>  

    <!-- CODE BELOW CONNECTS THE HTML FILE AND THE PYSCRIPT FILE-->
    <script type="py" src="main.py"></script>
</body></html>
